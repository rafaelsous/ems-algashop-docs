openapi: 3.0.4

info:
  title: AlgaShop - Ordering API
  version: "1.0"

servers:
  - description: Development
    url: http://localhost:8080
  - description: Production
    url: https://api.algashop.com.br

paths:
  /api/v1/customers:
    post:
      description: Register a new customer
      tags:
        - Customers
    get:
      description: List all customers
      tags:
        - Customers
  /api/v1/customers/{customerId}:
    get:
      description: Get customer details by ID
      tags:
        - Customers
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
          example: "0199675d-e16f-70c5-932e-207998e5e1b4"
    put:
      description: Update customer details by ID
      tags:
        - Customers
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
          example: "0199675d-e16f-70c5-932e-207998e5e1b4"
    delete:
      description: Delete customer by ID
      tags:
        - Customers
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
          example: "0199675d-e16f-70c5-932e-207998e5e1b4"