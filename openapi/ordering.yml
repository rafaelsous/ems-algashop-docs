openapi: 3.0.4

info:
  title: AlgaShop - Ordering API
  version: "1.0"

servers:
  - description: Development
    url: http://localhost:8080
  - description: Production
    url: https://api.algashop.com.br

paths:
  /api/v1/customers:
    post:
      description: Register a new customer
      tags:
        - Customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        201:
          description: Customer created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          headers:
            Location:
              schema:
                type: string
              description: 'URL of the created customer'
              example: '/api/v1/customers/0199675d-e16f-70c5-932e-207998e5e1b4'
        400:
          description: 'Invalid input data'
        409:
          description: 'Conflict - e.g., email already exists'
        422:
          description: 'Unprocessable Entity - e.g., validation errors'
        500:
          description: 'Internal server error'
    get:
      description: List all customers
      tags:
        - Customers
      responses:
        200:
          description: A list of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
  /api/v1/customers/{customerId}:
    get:
      description: Get customer details by ID
      tags:
        - Customers
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
          example: "0199675d-e16f-70c5-932e-207998e5e1b4"
      responses:
        200:
          description: Customer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        404:
          description: 'Customer not found'
    put:
      description: Update customer details by ID
      tags:
        - Customers
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
          example: "0199675d-e16f-70c5-932e-207998e5e1b4"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateInput'
      responses:
        200:
          description: Customer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        400:
          description: 'Invalid input data'
        404:
          description: 'Customer not found'
        409:
          description: 'Conflict - e.g., email already exists'
        422:
          description: 'Unprocessable Entity - e.g., validation errors'
        500:
          description: 'Internal server error'
    delete:
      description: Delete customer by ID
      tags:
        - Customers
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
          example: "0199675d-e16f-70c5-932e-207998e5e1b4"
      responses:
        204:
          description: 'Customer deleted successfully'
        404:
          description: 'Customer not found'

components:
  schemas:
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "0199675d-e16f-70c5-932e-207998e5e1b4"
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        email:
          type: string
          format: email
          example: "johndoe@example.com"
        document:
          type: string
          example: "12345"
        phone:
          type: string
          example: "1191234564"
        birthDate:
          type: string
          format: date
          example: "1990-01-01"
        loayaltyPoints:
          type: integer
          example: 100
        registeredAt:
          type: string
          format: date-time
          example: "2023-10-01T12:00:00Z"
        archivedAt:
          type: string
          format: date-time
          example: "2023-12-01T12:00:00Z"
        promotionNotificationsAllowed:
          type: boolean
          example: false
        archived:
          type: boolean
          example: false
        address:
          $ref: '#/components/schemas/Address'
    Address:
          type: object
          properties:
            street:
              type: string
              example: "123 Main St"
            number:
              type: string
              example: "100"
            complement:
              type: string
              example: "Apt 4B"
            neighborhood:
              type: string
              example: "Downtown"
            city:
              type: string
              example: "Springfield"
            state:
              type: string
              example: "South Carolina"
            zipCode:
              type: string
              example: "62701"
    CustomerInput:
      type: object
      properties:
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        email:
          type: string
          format: email
          example: "johndoe@example.com"
        document:
          type: string
          example: "12345"
        phone:
          type: string
          example: "1191234564"
        birthDate:
          type: string
          format: date
          example: "1990-01-01"
        promotionNotificationsAllowed:
          type: boolean
          example: false
        address:
          $ref: '#/components/schemas/Address'
    CustomerUpdateInput:
      type: object
      properties:
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        phone:
          type: string
          example: "1191234564"
        promotionNotificationsAllowed:
          type: boolean
          example: false
        address:
          $ref: '#/components/schemas/Address'